<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Petugas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Leaflet CSS & JS (Untuk Peta Adjust Lokasi Petugas) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    /* MENGHILANGKAN PANAH ATAS & BAWAH PADA INPUT NUMBER */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* Header Bar: Navigasi di Kiri, Logo di Kanan */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: relative;
    }

    .header-bar img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    /* Tombol Navigasi Utama */
    .menu-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .menu-trigger-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    /* Menu Dropdown / Overlay Navigasi */
    .nav-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 20px;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      padding: 8px;
    }

    .nav-dropdown.show {
      display: block;
    }

    .user-profile-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .user-profile-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .user-profile-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 2px;
      word-break: break-all;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.15s;
    }

    .nav-item-btn:hover {
      background: #f8fafc;
    }

    .nav-item-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-item-btn.logout {
      color: var(--danger-color);
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      border-radius: 0 0 8px 8px;
      padding-top: 12px;
    }

    /* Container Konten */
    .content-body {
      padding: 20px;
    }

    .auth-box {
      padding: 10px 5px;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    /* Styling Form Proporsional */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group label span {
      color: var(--danger-color);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    .form-control[readonly] {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* File Upload Box Khusus Kamera Direct */
    .camera-upload-box {
      background-color: #f0f9ff;
      border: 1px dashed #0284c7;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .camera-upload-box label {
      font-size: 13px;
      font-weight: 600;
      color: #0369a1;
      display: block;
      margin-bottom: 6px;
    }

    .camera-upload-box input[type="file"] {
      font-size: 12px;
      width: 100%;
    }

    /* Map Styling */
    #map-picker {
      height: 200px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-top: 6px;
    }

    .coords-info {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: block;
    }

    /* Button Action */
    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Grouping & Table Styling */
    .officer-group {
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }

    .officer-group-header {
      background-color: #f8fafc;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .officer-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #ffffff;
    }

    table th, table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      vertical-align: middle;
    }

    table th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
    }

    .img-preview {
      width: 52px;
      height: 52px;
      object-fit: cover;

      border: 1px solid var(--border-color);
    }

    .map-frame {

      height: 65px;
      border: none;
      border-radius: 6px;
    }

    .coord-badge {

      font-size: 11px;
      background: #f1f5f9;
      padding: 3px 6px;
      border-radius: 4px;
      color: #334155;
      display: inline-block;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .app-card {
        border-radius: 12px;
      }
    }
  </style>
</head>

  <script>

    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHVpdGF3aG1wcWtiZXBubXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0.9RHqwdWIb2xQ0M5I8xD189PB9Yms5gFbxNVqNa2BmlY';

    function initMapPicker() {
      if (!map) {
        map = L.map('map-picker').setView([selectedLat, selectedLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map);

        marker.on('dragend', function () {
          const latlng = marker.getLatLng();
          selectedLat = latlng.lat;
          selectedLng = latlng.lng;
          document.getElementById('coords-text').textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
        });
      }

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((pos) => {
          selectedLat = pos.coords.latitude;
          selectedLng = pos.coords.longitude;
          const userLatLng = [selectedLat, selectedLng];

          map.setView(userLatLng, 16);
          marker.setLatLng(userLatLng);
          document.getElementById('coords-text').textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
          setTimeout(() => map.invalidateSize(), 300);
        });
      }

    /* FUNGSI MENAMBAHKAN TIMESTAMP WATERMARK KE DALAM GAMBAR */
    function addTimestampWatermark(file, timestampText) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = img.width;
            canvas.height = img.height;

            // Gambar foto asli
            ctx.drawImage(img, 0, 0);

            // Ukuran font relatif
            const fontSize = Math.max(16, Math.floor(img.width / 28));
            ctx.font = `bold ${fontSize}px sans-serif`;

            // Latar belakang transparan hitam di bagian bawah foto
            const padding = fontSize * 0.8;
            const bannerHeight = fontSize * 2.5 + padding;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, img.height - bannerHeight, img.width, bannerHeight);

            // Teks Timestamp
            ctx.fillStyle = '#ffffff';
            ctx.fillText(timestampText.line1, padding, img.height - bannerHeight + fontSize + 4);
            ctx.fillStyle = '#fde047'; // Kuning terang untuk GPS
            ctx.fillText(timestampText.line2, padding, img.height - bannerHeight + (fontSize * 2) + 8);

            // Export Canvas kembali ke Blob / File
            canvas.toBlob((blob) => {
              const watermarkedFile = new File([blob], file.name, { type: file.type });
              resolve(watermarkedFile);
            }, file.type, 0.92);
          };
        };
      });
    }

    async function processAndUploadPhoto(fileInputId, pathPrefix, timeStr, lat, lng) {
      const fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) return null;

      const originalFile = fileInput.files[0];

      // Format timestamp Tgl/Waktu & LongLat
      const timestampText = {
        line1: `🕒 Waktu Baca: ${timeStr}`,
        line2: `📍 GPS: Lat ${lat.toFixed(6)}, Lng ${lng.toFixed(6)}`
      };

      // Proses Stamp Teks pada Gambar
      const watermarkedFile = await addTimestampWatermark(originalFile, timestampText);

      const fileExt = originalFile.name.split('.').pop();
      const fileName = `${pathPrefix}/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

      const { error } = await _supabase.storage
        .from('meter-photos')
        .upload(fileName, watermarkedFile, { cacheControl: '3600', upsert: false });

      if (error) return null;

      const { data: publicUrlData } = _supabase.storage
        .from('meter-photos')
        .getPublicUrl(fileName);

      return publicUrlData.publicUrl;
    }

      try {
        const readingDate = document.getElementById('reading_date').value;
        const readingTime = document.getElementById('reading_time').value;
        const formattedTimeStr = `${readingDate} ${readingTime}`;

        // Proses Stamp Timestamp & Upload Kamera
        const urlFotoMeter = await processAndUploadPhoto('foto_stand_meter', 'stand_meter', formattedTimeStr, selectedLat, selectedLng);
        const urlFotoBerkas = await processAndUploadPhoto('foto_berkas', 'berkas', formattedTimeStr, selectedLat, selectedLng);

        const { data: officerData } = await _supabase
          .from('officers')
          .select('id')
          .eq('auth_id', loggedInOfficer.id)
          .maybeSingle();

        const combinedTimestamp = new Date(`${readingDate}T${readingTime}`).toISOString();
        const standLaluVal = parseFloat(document.getElementById('stand_bulan_lalu').value) || 0;
        const standSekarangVal = parseFloat(document.getElementById('stand_meter').value) || 0;

        const payload = {
          officer_id: officerData ? officerData.id : null,
          customer_id: document.getElementById('customer_id').value,
          company_name: document.getElementById('company_name').value,
          cycle: parseInt(document.getElementById('cycle').value),
          stand_bulan_lalu: standLaluVal,
          stand_meter: standSekarangVal,
          foto_stand_meter: urlFotoMeter,
          foto_berkas: urlFotoBerkas,
          latitude: selectedLat,
          longitude: selectedLng,
          created_at: combinedTimestamp
        };

        const { error } = await _supabase.from('meter_readings').insert([payload]);
        if (error) throw error;

        alert('✅ Data hasil bacaan meter berhasil disimpan lengkap dengan timestamp foto!');
        document.getElementById('form-input-bacaan').reset();
        setTodayDateTime();

      } catch (err) {
        alert('❌ Gagal menyimpan data: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'SUBMIT';
      }
    });

    // LOAD HASIL BACAAN GROUPED BY OFFICER
    async function loadDataHasilBaca() {
      const container = document.getElementById('grouped-data-container');
      container.innerHTML = '<p style="color: var(--text-muted); padding: 12px; font-size: 13px;">Memuat data...</p>';

      const { data, error } = await _supabase
        .from('meter_readings')
        .select(`*, officers ( email )`)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color:red; padding: 12px;">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); padding: 12px; font-size: 13px;">Belum ada data hasil baca.</p>';
        return;
      }

      const grouped = {};
      data.forEach(row => {
        const officerName = row.officers ? row.officers.email : 'Petugas Tidak Teridentifikasi';
        if (!grouped[officerName]) {
          grouped[officerName] = [];
        }
        grouped[officerName].push(row);
      });

      let html = '';

      for (const [officer, items] of Object.entries(grouped)) {
        html += `
          <div class="officer-group">
            <div class="officer-group-header">
              <span>👤 ${officer}</span>
              <span class="officer-badge">${items.length} Data</span>
            </div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Waktu Baca</th>
                    <th>ID Pelanggan</th>
                    <th>Perusahaan</th>
                    <th>Cycle</th>
                    <th>Stand Bln Lalu</th>
                    <th>Stand Sekrg</th>
                    <th>Pemakaian</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Foto Stand</th>
                    <th>Foto Berkas</th>
                    <th>Peta</th>
                  </tr>
                </thead>
                <tbody>
        `;

        items.forEach(row => {
          const latVal = row.latitude ? row.latitude.toFixed(6) : '-';
          const lngVal = row.longitude ? row.longitude.toFixed(6) : '-';
          const standLalu = row.stand_bulan_lalu ?? 1250.00;
          const usage = (row.stand_meter - standLalu).toFixed(2);

          const fotoStandHtml = row.foto_stand_meter 
            ? `<a href="${row.foto_stand_meter}" target="_blank"><img src="${row.foto_stand_meter}" class="img-preview" alt="Foto Stand"></a>` 
            : '-';

          const fotoBerkasHtml = row.foto_berkas 
            ? `<a href="${row.foto_berkas}" target="_blank"><img src="${row.foto_berkas}" class="img-preview" alt="Foto Berkas"></a>` 
            : '-';

          const mapHtml = (row.latitude && row.longitude)
            ? `<iframe class="map-frame" src="https://maps.google.com/maps?q=${row.latitude},${row.longitude}&z=15&output=embed" loading="lazy"></iframe>`
            : '-';

          html += `
            <tr>
              <td style="white-space: nowrap;">${new Date(row.created_at).toLocaleString('id-ID')}</td>
              <td><b>${row.customer_id}</b></td>
              <td>${row.company_name}</td>
              <td>${row.cycle}</td>
              <td style="color: var(--text-muted);">${standLalu} m³</td>
              <td><b>${row.stand_meter} m³</b></td>
              <td style="color: var(--primary-color); font-weight:700;">${usage > 0 ? usage : 0} m³</td>
              <td><span class="coord-badge">${latVal}</span></td>
              <td><span class="coord-badge">${lngVal}</span></td>
              <td>${fotoStandHtml}</td>
              <td>${fotoBerkasHtml}</td>
              <td>${mapHtml}</td>
            </tr>
          `;
        });

        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    checkAuthSession();
  </script>
