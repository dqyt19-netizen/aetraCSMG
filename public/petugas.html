<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra - Aplikasi Petugas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6 border">
    
    <!-- HEADER LOGO -->
    <div class="flex justify-center mb-4 pb-4 border-b">
      <img src="logoaetra,jpg" alt="Logo Aetra Air Tangerang" class="h-16 object-contain">
    </div>

    <!-- FORM LOGIN PETUGAS -->
    <div id="loginSection">
      <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Login Petugas Meter</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Pilih Nama Petugas</label>
          <select id="selectPetugas" required class="w-full p-2 border rounded mt-1 bg-white">
            <option value="">-- Pilih Nama Anda --</option>
            <option value="udin@aetra.co.id">Udin</option>
            <option value="raka@aetra.co.id">Raka</option>
            <option value="dimas@aetra.co.id">Dimas</option>
            <option value="adel@aetra.co.id">Adel</option>
            <option value="damra@aetra.co.id">Damra</option>
            <option value="yayat@aetra.co.id">Yayat</option>
            <option value="rika@aetra.co.id">Rika</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" value="123456" placeholder="••••••••" required class="w-full p-2 border rounded mt-1">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition">MASUK</button>
      </form>
    </div>

    <!-- TAMPILAN DALAM PETUGAS (JIKA LOGIN BERHASIL) -->
    <div id="formSection" class="hidden">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <span class="text-xs text-green-700 font-bold" id="userAccount">Sesi Aktif</span>
        <button onclick="logout()" class="text-xs text-red-500 font-bold border border-red-200 px-2 py-1 rounded hover:bg-red-50">Logout</button>
      </div>
      <h3 class="text-lg font-bold text-blue-700 mb-2">Form Pencatatan Meter</h3>
      <p class="text-sm text-gray-600 mb-4">Login berhasil! Anda sudah masuk ke sistem pencatatan lapangan.</p>
      
      <!-- FORM INPUT METERAN -->
      <form id="meterForm" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700">ID Pelanggan</label>
          <input type="text" id="idPelanggan" placeholder="Contoh: PLG-001" required class="w-full p-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">Stand Meter Air (m³)</label>
          <input type="number" id="standMeter" placeholder="0000" required class="w-full p-2 border rounded text-sm">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white p-2 rounded font-bold text-sm hover:bg-green-700">Kirim Data Meter</button>
      </form>
    </div>

  </div>

  <script>
    // =========================================================================
    // PASTIKAN SUPABASE_URL DAN SUPABASE_KEY TERISI DENGAN BENAR
    // =========================================================================
    const SUPABASE_URL = "https://lfqhhyaxctbfaxjjytdz.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWhoeWF4Y3RiZmF4amp5dGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjE4MTYsImV4cCI6MjEwNTczNzgxNn0.uungyF3lq6-XH8lxW6SLeJDkTh7_eW0F1ss0Qzc3f0A"; 

    // Inisialisasi Supabase
    let supabaseClient;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      alert("Error Inisialisasi Supabase: " + e.message);
    }

    // Cek Sesi Login
    async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session) {
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('userAccount').innerText = "Logged in: " + session.user.email;
        }
      } catch (err) {
        console.error("Session Error:", err);
      }
    }

    // Proses Form Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const email = document.getElementById('selectPetugas').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          // JIKA LOGIN GAGAL, PERINGATAN POP-UP AKAN MUNCUL DENGAN DETAIL
          alert("KONEKSI/LOGIN GAGAL!\nPesan Error: " + error.message);
          btn.innerText = "MASUK";
          btn.disabled = false;
        } else {
          alert("Login Berhasil! Mengalihkan ke form petugas...");
          checkSession();
        }
      } catch (err) {
        alert("TERJADI KESALAHAN KODE/URL!\nDetail: " + err.message);
        btn.innerText = "MASUK";
        btn.disabled = false;
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    // Jalankan pengecekan otomatis
    checkSession();
  </script>
</body>
</html>
