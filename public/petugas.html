<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra - Portal Petugas Lapangan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- CONTAINER UTAMA -->
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-lg border overflow-hidden">
    
    <!-- HEADER LOGO -->
    <div class="flex justify-center items-center p-4 border-b bg-white">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Logo_Aetra_Air_Tangerang.jpg" alt="Logo Aetra Air Tangerang" class="h-12 object-contain">
    </div>

    <!-- SEKSI 1: FORM LOGIN PETUGAS -->
    <div id="loginSection" class="p-6 max-w-md mx-auto">
      <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Login Petugas Meter</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email / ID Petugas</label>
          <input type="email" id="emailPetugas" placeholder="contoh: udin@aetra.co.id" required class="w-full p-2.5 border rounded mt-1 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" required class="w-full p-2.5 border rounded mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">MASUK</button>
      </form>
    </div>

    <!-- SEKSI 2: DASHBOARD PETUGAS (LAYOUT SIDEBAR KIRI) -->
    <div id="formSection" class="hidden flex flex-col md:flex-row min-h-[500px]">
      
      <!-- NAVIGASI SIDEBAR SISI KIRI (POIN 1) -->
      <div class="w-full md:w-64 bg-gray-50 border-r border-gray-200 p-4 flex flex-col justify-between shrink-0 space-y-4">
        <div class="space-y-4">
          <!-- INFO USER -->
          <div class="bg-white p-3 rounded-lg border">
            <p class="text-[10px] text-gray-400 uppercase font-bold">Petugas Aktif</p>
            <p class="text-xs font-bold text-blue-700 truncate" id="userAccount">Petugas</p>
          </div>

          <!-- TOMBOL MENU NAVIGASI KIRI -->
          <nav class="space-y-2">
            <button id="navInputBtn" onclick="switchTab('input')" class="w-full text-left px-4 py-3 rounded-lg text-sm font-bold bg-blue-600 text-white flex items-center space-x-2 transition">
              <span>📝</span>
              <span>Input Bacaan</span>
            </button>
            <button id="navHistoryBtn" onclick="switchTab('history')" class="w-full text-left px-4 py-3 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-200 flex items-center space-x-2 transition">
              <span>📋</span>
              <span>Data Hasil Baca</span>
            </button>
          </nav>
        </div>

        <!-- TOMBOL LOGOUT DI BAWAH SIDEBAR -->
        <button onclick="logout()" class="w-full text-left px-4 py-2.5 rounded-lg text-xs font-bold text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 flex items-center space-x-2">
          <span>🚪</span>
          <span>Keluar / Logout</span>
        </button>
      </div>

      <!-- KONTEN UTAMA (SISI KANAN) -->
      <div class="flex-1 p-4 md:p-6 bg-white overflow-y-auto">
        
        <!-- PANEL 1: FORM INPUT BACAAN -->
        <div id="panelInput" class="space-y-4 max-w-xl">
          <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Form Input Bacaan Meter</h3>

          <form id="meterForm" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">ID Pelanggan <span class="text-red-500">*</span></label>
              <input type="text" id="idPelanggan" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Nama Perusahaan / Consumer <span class="text-red-500">*</span></label>
              <input type="text" id="namaPerusahaan" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Cycle (1 - 15) <span class="text-red-500">*</span></label>
                <input type="number" id="cycle" min="1" max="15" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Stand Meter Air (m³) <span class="text-red-500">*</span></label>
                <input type="number" step="0.01" id="standMeter" required class="w-full p-2.5 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
              </div>
            </div>

            <!-- FOTO 1 -->
            <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg">
              <label class="block text-xs font-bold text-blue-900 mb-1">1. Foto Stand Meter Air <span class="text-red-500">*</span></label>
              <input type="file" id="fotoMeter" accept="image/*" capture="environment" required class="w-full text-xs">
            </div>

            <!-- FOTO 2 -->
            <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg">
              <label class="block text-xs font-bold text-blue-900 mb-1">2. Foto Berkas Cetak & TTD PIC <span class="text-red-500">*</span></label>
              <input type="file" id="fotoBerkas" accept="image/*" capture="environment" required class="w-full text-xs">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">
              KIRIM DATA & KOORDINAT GPS
            </button>
          </form>
        </div>

        <!-- PANEL 2: TABEL DATA HASIL BACA -->
        <div id="panelHistory" class="hidden space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="text-lg font-bold text-gray-800">Data Hasil Baca Petugas</h3>
            <button onclick="loadHistoryData()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 border rounded-lg font-semibold">🔄 Refresh Data</button>
          </div>

          <div class="overflow-x-auto border rounded-lg">
            <table class="w-full text-left text-xs text-gray-600">
              <thead class="bg-gray-100 text-gray-700 border-b">
                <tr>
                  <th class="p-3">ID Pelanggan</th>
                  <th class="p-3">Perusahaan</th>
                  <th class="p-3">Stand</th>
                  <th class="p-3">Koordinat (Long, Lat)</th>
                  <th class="p-3">Foto</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // =========================================================================
    // PASTIKAN KUNCI SUPABASE INI DIGANTI DENGAN MILIK ANDA
    // =========================================================================
    const SUPABASE_URL = "https://dntuitawhmpqkbepnmwk.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHVpdGF3aG1wcWtiZXBubXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0.9RHqwdWIb2xQ0M5I8xD189PB9Yms5gFbxNVqNa2BmlY"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session) {
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('userAccount').innerText = session.user.email;
          loadHistoryData();
        }
      } catch (err) {
        console.error("Session Error:", err);
      }
    }

    // Fungsi Switch Navigasi Kiri
    function switchTab(tabName) {
      const panelInput = document.getElementById('panelInput');
      const panelHistory = document.getElementById('panelHistory');
      const navInputBtn = document.getElementById('navInputBtn');
      const navHistoryBtn = document.getElementById('navHistoryBtn');

      if (tabName === 'input') {
        panelInput.classList.remove('hidden');
        panelHistory.classList.add('hidden');
        navInputBtn.className = "w-full text-left px-4 py-3 rounded-lg text-sm font-bold bg-blue-600 text-white flex items-center space-x-2 transition";
        navHistoryBtn.className = "w-full text-left px-4 py-3 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-200 flex items-center space-x-2 transition";
      } else {
        panelInput.classList.add('hidden');
        panelHistory.classList.remove('hidden');
        navHistoryBtn.className = "w-full text-left px-4 py-3 rounded-lg text-sm font-bold bg-blue-600 text-white flex items-center space-x-2 transition";
        navInputBtn.className = "w-full text-left px-4 py-3 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-200 flex items-center space-x-2 transition";
        loadHistoryData();
      }
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const email = document.getElementById('emailPetugas').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          alert("Gagal Login: " + error.message);
          btn.innerText = "MASUK";
          btn.disabled = false;
        } else {
          checkSession();
        }
      } catch (err) {
        alert("Terjadi kesalahan sistem: " + err.message);
        btn.innerText = "MASUK";
        btn.disabled = false;
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    // Helper Upload Foto
    async function uploadFile(fileInput, prefix) {
      const file = fileInput.files[0];
      const fileName = `${prefix}_${Date.now()}_${file.name}`;
      
      const { data, error } = await supabaseClient.storage
        .from('meter-proofs')
        .upload(fileName, file);

      if (error) throw error;
      return `${SUPABASE_URL}/storage/v1/object/public/meter-proofs/${fileName}`;
    }

    // Submit Data
    document.getElementById('meterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Mengambil GPS & Mengirim...";
      btn.disabled = true;

      if (!navigator.geolocation) {
        alert("GPS tidak didukung oleh perangkat ini.");
        btn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const long = position.coords.longitude;

        try {
          const urlFotoMeter = await uploadFile(document.getElementById('fotoMeter'), 'meter');
          const urlFotoBerkas = await uploadFile(document.getElementById('fotoBerkas'), 'berkas');

          const { data: { user } } = await supabaseClient.auth.getUser();

          const { error } = await supabaseClient.from('meter_readings').insert([{
            petugas_id: user.id,
            id_pelanggan: document.getElementById('idPelanggan').value,
            nama_perusahaan: document.getElementById('namaPerusahaan').value,
            cycle: parseInt(document.getElementById('cycle').value),
            stand_meter: parseFloat(document.getElementById('standMeter').value),
            latitude: lat,
            longitude: long,
            foto_meter_url: urlFotoMeter,
            foto_berkas_url: urlFotoBerkas
          }]);

          if (error) {
            alert("Gagal Menyimpan ke Database:\n" + error.message + "\n\nSaran: Pastikan RLS di Supabase sudah di-Disable.");
            throw error;
          }

          alert("Data & Koordinat GPS berhasil disimpan!");
          document.getElementById('meterForm').reset();
          switchTab('history');
        } catch (err) {
          console.error(err);
        } finally {
          btn.innerText = "KIRIM DATA & KOORDINAT GPS";
          btn.disabled = false;
        }
      }, (err) => {
        alert("Akses GPS ditolak/gagal. Mohon aktifkan izin lokasi HP Anda.");
        btn.innerText = "KIRIM DATA & KOORDINAT GPS";
        btn.disabled = false;
      }, { enableHighAccuracy: true });
    });

    // Memuat Riwayat
    async function loadHistoryData() {
      const tableBody = document.getElementById('historyTableBody');
      tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data...</td></tr>';

      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { data, error } = await supabaseClient
          .from('meter_readings')
          .select('*')
          .eq('petugas_id', user.id)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada data yang dikerjakan.</td></tr>';
          return;
        }

        tableBody.innerHTML = '';
        data.forEach(item => {
          tableBody.innerHTML += `
            <tr class="border-b hover:bg-gray-50">
              <td class="p-3 font-bold">${item.id_pelanggan}</td>
              <td class="p-3">${item.nama_perusahaan}</td>
              <td class="p-3">${item.stand_meter} m³</td>
              <td class="p-3 font-mono text-[10px]">${item.longitude ? item.longitude.toFixed(5) : '-'}, ${item.latitude ? item.latitude.toFixed(5) : '-'}</td>
              <td class="p-3">
                <a href="${item.foto_meter_url}" target="_blank" class="text-blue-600 underline text-[10px]">Meter</a> | 
                <a href="${item.foto_berkas_url}" target="_blank" class="text-blue-600 underline text-[10px]">Berkas</a>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Gagal memuat: ${err.message}</td></tr>`;
      }
    }

    checkSession();
  </script>
</body>
</html>
