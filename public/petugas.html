<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Petugas Meter Reading - Aetra</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6 border">

    <!-- HEADER LOGO -->
    <div class="text-center space-y-2">
      <img 
        src="logoaetra.jpg" 
        alt="Logo Aetra Air Tangerang" 
        class="h-14 mx-auto object-contain mb-2"
      >
      <h2 class="text-xl font-bold text-blue-700">Aplikasi Petugas Meter</h2>
      <p class="text-xs text-gray-500">PT Aetra Air Tangerang - Portal Pencatatan Meter</p>
    </div>

    <!-- SEKSI 1: FORM LOGIN PETUGAS -->
    <div id="loginSection" class="space-y-4">
      <div class="bg-blue-50 border-l-4 border-blue-500 p-3 text-xs text-blue-700 rounded">
        Silakan pilih nama petugas dan masukkan password Anda.
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">PILIH PETUGAS</label>
          <select id="selectPetugas" class="w-full border border-gray-300 rounded p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <option value="" disabled selected>-- Pilih Petugas --</option>
            <option value="udin@aetra.co.id">Udin - Petugas Area 1</option>
            <option value="raka@aetra.co.id">Raka - Petugas Area 2</option>
            <option value="budi@aetra.co.id">Budi - Petugas Area 3</option>
            <option value="siti@aetra.co.id">Siti - Petugas Area 4</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">PASSWORD</label>
          <input type="password" id="password" placeholder="Masukkan password" class="w-full border border-gray-300 rounded p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">
          MASUK
        </button>
      </form>
    </div>

    <!-- SEKSI 2: FORM PENCATATAN METER (AKAN MUNCUL SETELAH LOGIN BERHASIL) -->
    <div id="formSection" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-green-50 border border-green-200 p-3 rounded-lg text-xs">
        <div>
          <p class="font-bold text-green-800" id="userStatus">Status: Terhubung</p>
          <p class="text-green-600" id="userAccount"></p>
        </div>
        <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-xs font-semibold">
          Keluar
        </button>
      </div>

      <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Form Input Angka Meter</h3>

      <form id="meterForm" class="space-y-3 text-sm">
        <div>
          <label class="block font-medium text-gray-700 mb-1">ID Pelanggan</label>
          <input type="text" id="idPelanggan" placeholder="Contoh: PLG-1002" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">Angka Meter Bulan Ini (m³)</label>
          <input type="number" id="angkaMeter" placeholder="Masukkan angka meter" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div>
          <label class="block font-medium text-gray-700 mb-1">Foto Fisik Meteran</label>
          <input type="file" id="fotoMeter" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button type="submit" id="btnSubmitMeter" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded shadow transition">
          Simpan Data Meter
        </button>
      </form>
    </div>

  </div>

  <!-- SCRIPT JAVASCRIPT & SUPABASE -->
  <script>
    // 1. KUNCI API SUPABASE (PASTIKAN SUDAH SESUAI DENGAN PROJECT SETTINGS > API ANDA)
    const SUPABASE_URL = "https://lfqhhyaxctbfaxjjytdz.supabase.co"; // <-- Masukkan URL Supabase Anda
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWhoeWF4Y3RiZmF4amp5dGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjE4MTYsImV4cCI6MjEwNTczNzgxNn0.uungyF3lq6-XH8lxW6SLeJDkTh7_eW0F1ss0Qzc3f0A";      // <-- Masukkan anon public key Supabase Anda

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. PROSES LOGIN PETUGAS
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memproses Login...";
      btn.disabled = true;

      const email = document.getElementById('selectPetugas').value;
      const password = document.getElementById('password').value;

      try {
        // Melakukan verifikasi login ke database Supabase
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          // Jika login gagal (misal password salah)
          alert("Gagal Login!\nPenyebab: " + error.message);
          btn.innerText = "MASUK";
          btn.disabled = false;
        } else {
          // Jika login berhasil
          alert("Login Berhasil! Selamat bertugas.");
          
          // Sembunyikan Form Login, Tampilkan Form Pencatatan
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('userAccount').innerText = "Akun: " + data.user.email;
        }
      } catch (err) {
        alert("Koneksi Gagal!\nError: " + err.message + "\n\nPastikan SUPABASE_URL dan SUPABASE_KEY sudah diganti dengan milik Anda.");
        btn.innerText = "MASUK";
        btn.disabled = false;
      }
    });

    // 3. PROSES LOGOUT PETUGAS
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      alert("Anda telah keluar.");
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('password').value = "";
      document.getElementById('btnLogin').innerText = "MASUK";
      document.getElementById('btnLogin').disabled = false;
    });

    // 4. PROSES SIMPAN DATA METER (OPSIONAL)
    document.getElementById('meterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert("Data meter pelanggan " + document.getElementById('idPelanggan').value + " berhasil dicatat!");
      document.getElementById('meterForm').reset();
    });
  </script>

</body>
</html>
