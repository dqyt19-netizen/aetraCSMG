<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra - Aplikasi Petugas Meter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6 border">
    
    <!-- HEADER LOGO -->
    <div class="flex justify-center mb-4 pb-4 border-b">
      <img src="logoaetra.jpg" alt="Logo Aetra Air Tangerang" class="h-16 object-contain">
    </div>

    <!-- SEKSI 1: FORM LOGIN PETUGAS (TANPA DROPDOWN & TANPA PLACEHOLDER PASS) -->
    <div id="loginSection">
      <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Login Petugas Meter</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email / ID Petugas</label>
          <input type="email" id="emailPetugas" placeholder="contoh: udin@aetra.co.id" required class="w-full p-2 border rounded mt-1 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" required class="w-full p-2 border rounded mt-1">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition">MASUK</button>
      </form>
    </div>

    <!-- SEKSI 2: FORM LENGKAP PENCATATAN METER (TAMPIL SETELAH LOGIN) -->
    <div id="formSection" class="hidden">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <span class="text-xs text-gray-500 font-bold" id="userAccount">Petugas Logged In</span>
        <button onclick="logout()" class="text-xs text-red-500 font-bold border border-red-200 px-2 py-1 rounded hover:bg-red-50">Logout</button>
      </div>

      <h2 class="text-lg font-bold text-blue-700 mb-4">Form Pencatatan Meter</h2>

      <form id="meterForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">ID Pelanggan</label>
          <input type="text" id="idPelanggan" required class="w-full p-2 border rounded">
        </div>
        
        <div>
          <label class="block text-sm font-medium">Nama Perusahaan / Consumer</label>
          <input type="text" id="namaPerusahaan" required class="w-full p-2 border rounded">
        </div>

        <div>
          <label class="block text-sm font-medium">Pembacaan Cycle (1 - 15)</label>
          <input type="number" id="cycle" min="1" max="15" required class="w-full p-2 border rounded">
        </div>

        <div>
          <label class="block text-sm font-medium">Stand Meter Air</label>
          <input type="number" step="0.01" id="standMeter" required class="w-full p-2 border rounded">
        </div>

        <!-- INPUT FOTO 1: STAND METER -->
        <div class="p-3 bg-blue-50 border border-blue-200 rounded">
          <label class="block text-sm font-bold text-blue-900 mb-1">1. Foto Stand Meter Air</label>
          <input type="file" id="fotoMeter" accept="image/*" capture="environment" required class="w-full text-sm">
        </div>

        <!-- INPUT FOTO 2: LEMBARAN BERKAS & TTD PIC -->
        <div class="p-3 bg-blue-50 border border-blue-200 rounded">
          <label class="block text-sm font-bold text-blue-900 mb-1">2. Foto Berkas Cetak & TTD PIC</label>
          <input type="file" id="fotoBerkas" accept="image/*" capture="environment" required class="w-full text-sm">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">KIRIM DATA & LOKASI</button>
      </form>
    </div>

  </div>

  <script>
    // =========================================================================
    // PASTI KAN SUPABASE_URL DAN SUPABASE_KEY SUDAH SESUAI DENGAN MILIK ANDA
    // =========================================================================
    const SUPABASE_URL = "https://lfqhhyaxctbfaxjjytdz.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWhoeWF4Y3RiZmF4amp5dGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjE4MTYsImV4cCI6MjEwNTczNzgxNn0.uungyF3lq6-XH8lxW6SLeJDkTh7_eW0F1ss0Qzc3f0A"; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cek Sesi Login
    async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session) {
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('formSection').classList.remove('hidden');
          document.getElementById('userAccount').innerText = "Logged in: " + session.user.email;
        }
      } catch (err) {
        console.error("Session Error:", err);
      }
    }

    // Process Login Petugas
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const email = document.getElementById('emailPetugas').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          alert("Gagal Login: " + error.message);
          btn.innerText = "MASUK";
          btn.disabled = false;
        } else {
          checkSession();
        }
      } catch (err) {
        alert("Terjadi kesalahan sistem: " + err.message);
        btn.innerText = "MASUK";
        btn.disabled = false;
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    // Helper Upload Foto ke Supabase Storage
    async function uploadFile(fileInput, prefix) {
      const file = fileInput.files[0];
      const fileName = `${prefix}_${Date.now()}_${file.name}`;
      
      const { data, error } = await supabaseClient.storage
        .from('meter-proofs')
        .upload(fileName, file);

      if (error) throw error;
      return `${SUPABASE_URL}/storage/v1/object/public/meter-proofs/${fileName}`;
    }

    // Process Submit Data & Ambil Lokasi GPS
    document.getElementById('meterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Mengambil Lokasi & Mengirim...";
      btn.disabled = true;

      if (!navigator.geolocation) {
        alert("GPS tidak didukung oleh browser Anda.");
        btn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const long = position.coords.longitude;

        try {
          // Upload Kedua Foto
          const urlFotoMeter = await uploadFile(document.getElementById('fotoMeter'), 'meter');
          const urlFotoBerkas = await uploadFile(document.getElementById('fotoBerkas'), 'berkas');

          // Ambil User ID Petugas yang Login
          const { data: { user } } = await supabaseClient.auth.getUser();

          // Simpan Data ke Supabase Database
          const { error } = await supabaseClient.from('meter_readings').insert([{
            petugas_id: user.id,
            id_pelanggan: document.getElementById('idPelanggan').value,
            nama_perusahaan: document.getElementById('namaPerusahaan').value,
            cycle: parseInt(document.getElementById('cycle').value),
            stand_meter: parseFloat(document.getElementById('standMeter').value),
            latitude: lat,
            longitude: long,
            foto_meter_url: urlFotoMeter,
            foto_berkas_url: urlFotoBerkas
          }]);

          if (error) throw error;

          alert("Data pencatatan & lokasi berhasil dikirim!");
          document.getElementById('meterForm').reset();
        } catch (err) {
          alert("Gagal mengirim data: " + err.message);
        } finally {
          btn.innerText = "KIRIM DATA & LOKASI";
          btn.disabled = false;
        }
      }, (err) => {
        alert("Akses Lokasi/GPS ditolak. Mohon aktifkan GPS HP Anda.");
        btn.innerText = "KIRIM DATA & LOKASI";
        btn.disabled = false;
      }, { enableHighAccuracy: true });
    });

    checkSession();
  </script>
</body>
</html>
