<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra - Pencatatan Meter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-blue-600">Form Pencatatan Meter</h2>

    <form id="meterForm" class="space-y-3">
      <div>
        <label class="block text-sm font-medium">Nama Petugas</label>
        <input type="text" id="namaPetugas" required class="w-full p-2 border rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">ID Pelanggan</label>
        <input type="text" id="idPelanggan" required class="w-full p-2 border rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Nama Perusahaan</label>
        <input type="text" id="namaPerusahaan" required class="w-full p-2 border rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Cycle (1 - 15)</label>
        <input type="number" id="cycle" min="1" max="15" required class="w-full p-2 border rounded">
      </div>
      <div>
        <label class="block text-sm font-medium">Stand Meter Air</label>
        <input type="number" step="0.01" id="standMeter" required class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="block text-sm font-medium">Koordinat GPS</label>
        <button type="button" onclick="getGPS()" class="bg-gray-200 px-3 py-1 rounded text-sm mb-1">Ambil Lokasi Saya</button>
        <input type="text" id="coords" readonly required class="w-full p-2 border rounded bg-gray-50" placeholder="Lat, Long">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Tanda Tangan PIC Perusahaan</label>
        <canvas id="signature-pad" class="border rounded w-full h-32 bg-white"></canvas>
        <button type="button" onclick="clearSignature()" class="text-xs text-red-500 mt-1">Hapus Tanda Tangan</button>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">KIRIM DATA</button>
    </form>
  </div>

  <script>
    // KONEKSI SUPABASE (Diisi variabel Vercel nanti)
    const SUPABASE_URL = "https://lfqhhyaxctbfaxjjytdz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWhoeWF4Y3RiZmF4amp5dGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjE4MTYsImV4cCI6MjEwNTczNzgxNn0.uungyF3lq6-XH8lxW6SLeJDkTh7_eW0F1ss0Qzc3f0A";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inisialisasi Tanda Tangan
    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas);

    function clearSignature() {
      signaturePad.clear();
    }

    let lat = 0, long = 0;
    function getGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          lat = pos.coords.latitude;
          long = pos.coords.longitude;
          document.getElementById('coords').value = `${lat}, ${long}`;
        }, () => alert("Gagal mengambil posisi GPS"));
      }
    }

    document.getElementById('meterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (signaturePad.isEmpty()) {
        return alert("Tanda tangan PIC wajib diisi!");
      }

      // Ubah tanda tangan ke format gambar
      const dataUrl = signaturePad.toDataURL();
      const blob = await (await fetch(dataUrl)).blob();
      const fileName = `ttd_${Date.now()}.png`;

      // 1. Upload TTD ke Supabase Storage
      const { data: imgData, error: imgErr } = await supabase.storage
        .from('meter-proofs')
        .upload(fileName, blob);

      if (imgErr) return alert("Gagal upload bukti: " + imgErr.message);

      const fotoUrl = `${SUPABASE_URL}/storage/v1/object/public/meter-proofs/${fileName}`;

      // 2. Simpan Data ke Database Supabase
      const { error } = await supabase.from('meter_readings').insert([{
        id_pelanggan: document.getElementById('idPelanggan').value,
        nama_perusahaan: document.getElementById('namaPerusahaan').value,
        cycle: parseInt(document.getElementById('cycle').value),
        stand_meter: parseFloat(document.getElementById('standMeter').value),
        latitude: lat,
        longitude: long,
        foto_bukti_url: fotoUrl,
        petugas_id: "ID_USER_PETUGAS" // Dapat disesuaikan dengan fitur Login Supabase
      }]);

      if (error) {
        alert("Gagal kirim data: " + error.message);
      } else {
        alert("Data Berhasil Terkirim!");
        location.reload();
      }
    });
  </script>
</body>
</html>
