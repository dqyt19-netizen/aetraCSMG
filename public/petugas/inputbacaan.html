<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Input Bacaan Meter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 600px;
      overflow: visible;
      border: 1px solid var(--border-color);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: relative;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .header-bar img {
      height: 36px;
      width: auto;
    }

    .menu-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 20px;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      padding: 8px;
    }

    .nav-dropdown.show {
      display: block;
    }

    .user-profile-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .user-profile-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .user-profile-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 2px;
      word-break: break-all;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-item-btn.logout {
      color: var(--danger-color);
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .content-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-bar">
      <div id="nav-wrapper">
        <button class="menu-trigger-btn" onclick="toggleMenu()">
          <span>☰ Menu</span>
        </button>
        <div class="nav-dropdown" id="nav-dropdown">
          <div class="user-profile-item">
            <div class="label">Petugas Aktif</div>
            <div class="name" id="display-email">petugas@aetra.co.id</div>
          </div>
          <button class="nav-item-btn active" onclick="window.location.href='/petugas/inputbacaan.html'">
            📝 Input Bacaan
          </button>
          <button class="nav-item-btn" onclick="window.location.href='/petugas/hasilbacaan.html'">
            📋 Hasil Bacaan
          </button>
          <button class="nav-item-btn logout" onclick="logout()">
            🚪 Keluar / Logout
          </button>
        </div>
      </div>
      <!-- Gambar Logo Menggunakan Path Absolut -->
      <img src="/logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>

    <div class="content-body">
      <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">Form Input Bacaan Meter</h2>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Masukkan data pencatatan meter terbaru.</p>

      <form id="input-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="id_pelanggan">ID Pelanggan</label>
          <input type="text" id="id_pelanggan" required placeholder="Contoh: PLG-1001">
        </div>

        <div class="form-group">
          <label for="nama_perusahaan">Nama Perusahaan / Pelanggan</label>
          <input type="text" id="nama_perusahaan" required placeholder="PT. Jaya Abadi">
        </div>

        <div class="form-group">
          <label for="cycle">Cycle</label>
          <input type="number" id="cycle" required placeholder="01">
        </div>

        <div class="form-group">
          <label for="stand_meter">Stand Meter (m³)</label>
          <input type="number" step="any" id="stand_meter" required placeholder="0">
        </div>

        <div class="form-group">
          <label for="foto_meter">Foto Stand Meter</label>
          <input type="file" id="foto_meter" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="foto_berkas">Foto Berkas / Lokasi</label>
          <input type="file" id="foto_berkas" accept="image/*">
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Simpan Data</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dntuitawhmpqkbepnmwk.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHVpdGF3aG1wcWtiZXBubXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0.9RHqwdWIb2xQ0M5I8xD189PB9Yms5gFbxNVqNa2BmlY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let userLocation = { latitude: null, longitude: null };

    function toggleMenu() {
      document.getElementById('nav-dropdown').classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      const wrapper = document.getElementById('nav-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('nav-dropdown').classList.remove('show');
      }
    });

    async function checkAuthSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = '/petugas/login.html';
      } else {
        document.getElementById('display-email').textContent = session.user.email;
        getGeoLocation();
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = '/petugas/login.html';
    }

    function getGeoLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          userLocation.latitude = pos.coords.latitude;
          userLocation.longitude = pos.coords.longitude;
        }, (err) => console.log(err));
      }
    }

    async function uploadFile(file, folder) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `${folder}/${fileName}`;

      const { data, error } = await _supabase.storage
        .from('meter_photos')
        .upload(filePath, file);

      if (error) throw error;

      const { data: { publicUrl } } = _supabase.storage
        .from('meter_photos')
        .getPublicUrl(filePath);

      return publicUrl;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Mengunggah & Menyimpan...';

      try {
        const fotoMeterFile = document.getElementById('foto_meter').files[0];
        const fotoBerkasFile = document.getElementById('foto_berkas').files[0];

        let foto_meter_url = await uploadFile(fotoMeterFile, 'stand');
        let foto_berkas_url = fotoBerkasFile ? await uploadFile(fotoBerkasFile, 'berkas') : null;

        const payload = {
          id_pelanggan: document.getElementById('id_pelanggan').value,
          nama_perusahaan: document.getElementById('nama_perusahaan').value,
          cycle: document.getElementById('cycle').value,
          stand_meter: parseFloat(document.getElementById('stand_meter').value),
          latitude: userLocation.latitude,
          longitude: userLocation.longitude,
          foto_meter_url: foto_meter_url,
          foto_berkas_url: foto_berkas_url
        };

        const { error } = await _supabase.from('meter_readings').insert([payload]);
        if (error) throw error;

        alert('Data berhasil disimpan!');
        window.location.href = '/petugas/hasilbacaan.html';
      } catch (err) {
        alert('Gagal menyimpan: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Simpan Data';
      }
    }

    checkAuthSession();
  </script>
</body>
</html>
