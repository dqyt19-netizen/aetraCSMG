<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Input Bacaan Meter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- CSS & JS Leaflet untuk Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 600px;
      position: relative;
      border: 1px solid var(--border-color);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .header-bar img {
      height: 36px;
      width: auto;
    }

    .menu-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-dropdown {
      display: none;
      position: absolute;
      top: 70px;
      left: 20px;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 9999;
      padding: 8px;
    }

    .nav-dropdown.show {
      display: block;
    }

    .user-profile-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .user-profile-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .user-profile-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 2px;
      word-break: break-all;
    }

    .nav-item-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-item-btn.logout {
      color: var(--danger-color);
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .content-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }

    /* Container untuk Peta */
    #map-container {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-top: 6px;
      z-index: 1;
    }

    .location-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-bar">
      <div id="nav-wrapper">
        <button class="menu-trigger-btn" onclick="toggleMenu(event)">
          <span>☰ Menu</span>
        </button>
        <div class="nav-dropdown" id="nav-dropdown">
          <div class="user-profile-item">
            <div class="label">Petugas Aktif</div>
            <div class="name" id="display-email">Memuat...</div>
          </div>
          <button class="nav-item-btn active" onclick="window.location.href='inputbacaan.html'">
            📝 Input Bacaan
          </button>
          <button class="nav-item-btn" onclick="window.location.href='hasilbacaan.html'">
            📋 Hasil Bacaan
          </button>
          <button class="nav-item-btn logout" onclick="logout()">
            🚪 Keluar / Logout
          </button>
        </div>
      </div>
      <img src="logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>

    <div class="content-body">
      <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">Form Input Bacaan Meter</h2>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Masukkan data pencatatan meter terbaru.</p>

      <form id="input-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="id_pelanggan">ID Pelanggan</label>
          <input type="text" id="id_pelanggan" required placeholder="Contoh: PLG-1001">
        </div>

        <div class="form-group">
          <label for="nama_perusahaan">Nama Perusahaan / Pelanggan</label>
          <input type="text" id="nama_perusahaan" required placeholder="PT. Jaya Abadi">
        </div>

        <div class="form-group">
          <label for="cycle">Cycle</label>
          <input type="text" id="cycle" required placeholder="01">
        </div>

        <div class="form-group">
          <label for="stand_meter">Stand Meter (m³)</label>
          <input type="number" step="any" id="stand_meter" required placeholder="0">
        </div>

        <div class="form-group">
          <label for="foto_meter">Foto Stand Meter</label>
          <input type="file" id="foto_meter" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="foto_berkas">Foto Berkas / Lokasi</label>
          <input type="file" id="foto_berkas" accept="image/*">
        </div>

        <!-- Bagian Elemen Peta Lokasi -->
        <div class="form-group">
          <label>Lokasi Petugas (GPS Map)</label>
          <div id="map-container"></div>
          <div class="location-info">
            <span id="coord-status">Mendeteksi lokasi...</span>
            <button type="button" onclick="initMap()" style="background:none; border:none; color:var(--primary-color); cursor:pointer; font-weight:600;">🔄 Refresh Lokasi</button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Simpan Data</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tcikpmtuxaxjfucwjrah.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjaWtwbXR1eGF4amZ1Y3dqcmFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDc5MTUsImV4cCI6MjEwNjE4MzkxNX0.Tg75hNg6zzaRSJ-L5O3w9UtzQbyqBgjlMaLBGv_ANYc'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_BUCKET = 'meter-photos';

    let userLocation = { latitude: -6.1783, longitude: 106.6319 };
    let map = null;
    let marker = null;

    function toggleMenu(event) {
      event.stopPropagation();
      document.getElementById('nav-dropdown').classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      const dropdown = document.getElementById('nav-dropdown');
      if (dropdown && !dropdown.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    async function checkAuthSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
      } else {
        document.getElementById('display-email').textContent = session.user.email;
        // Inisialisasi peta setelah sesi aman dan elemen siap
        setTimeout(initMap, 200);
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'login.html';
    }

    function initMap() {
      const statusText = document.getElementById('coord-status');
      statusText.textContent = 'Mendeteksi lokasi GPS...';

      const defaultLat = -6.1783;
      const defaultLng = 106.6319;

      if (!map) {
        map = L.map('map-container').setView([defaultLat, defaultLng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);

        marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

        marker.on('dragend', function (e) {
          const latLng = marker.getLatLng();
          userLocation.latitude = latLng.lat;
          userLocation.longitude = latLng.lng;
          statusText.textContent = `Lat: ${latLng.lat.toFixed(5)}, Lng: ${latLng.lng.toFixed(5)} (Manual)`;
        });
      } else {
        map.invalidateSize();
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            userLocation.latitude = lat;
            userLocation.longitude = lng;

            map.setView([lat, lng], 16);
            marker.setLatLng([lat, lng]);
            statusText.textContent = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
          },
          (err) => {
            statusText.textContent = 'GPS gagal/dinonaktifkan. Geser pin pada peta.';
            userLocation.latitude = defaultLat;
            userLocation.longitude = defaultLng;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        statusText.textContent = 'Browser tidak mendukung GPS.';
      }
    }

    async function uploadFile(file, folder) {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `${folder}/${fileName}`;

      const { data, error } = await _supabase.storage
        .from(STORAGE_BUCKET)
        .upload(filePath, file);

      if (error) throw error;

      const { data: { publicUrl } } = _supabase.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(filePath);

      return publicUrl;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Mengunggah & Menyimpan...';

      try {
        // Pastikan bagian ini ada di dalam fungsi handleSubmit(e) di inputbacaan.html
          const { data: { session } } = await _supabase.auth.getSession();
          const petugasEmail = session ? session.user.email : 'unknown';

        const payload = {
      // ... data form lainnya ...
        petugas_email: petugasEmail // Ini memastikan email petugas ikut tersimpan ke database
    };

        const fotoMeterFile = document.getElementById('foto_meter').files[0];
        const fotoBerkasFile = document.getElementById('foto_berkas').files[0];

        let foto_meter_url = await uploadFile(fotoMeterFile, 'stand');
        let foto_berkas_url = fotoBerkasFile ? await uploadFile(fotoBerkasFile, 'berkas') : null;

        const payload = {
          id_pelanggan: document.getElementById('id_pelanggan').value,
          nama_perusahaan: document.getElementById('nama_perusahaan').value,
          cycle: document.getElementById('cycle').value,
          stand_meter: parseFloat(document.getElementById('stand_meter').value),
          latitude: userLocation.latitude,
          longitude: userLocation.longitude,
          foto_meter_url: foto_meter_url,
          foto_berkas_url: foto_berkas_url,
          petugas_email: petugasEmail // <-- Diperbaiki dengan tanda koma (,) di baris sebelumnya
        };

        const { error } = await _supabase.from('meter_readings').insert([payload]);
        if (error) throw error;

        alert('Data berhasil disimpan!');
        window.location.href = 'hasilbacaan.html';
      } catch (err) {
        alert('Gagal menyimpan: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Simpan Data';
      }
    }

    checkAuthSession();
  </script>
</body>
</html>
