<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Login Petugas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      padding: 28px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      height: 48px;
      width: auto;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* Styling Tautan Kembali ke Halaman Utama */
    .back-home {
      margin-top: 16px;
      text-align: center;
    }

    .back-home a {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-home a:hover {
      color: var(--primary-color);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <!-- Menggunakan Absolute Path ke /logoaetra.jpg di folder public -->
      <img src="/logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>
    
    <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">Login Petugas</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Masukkan akun petugas Anda</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="petugas@aetra.co.id" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-login">Masuk</button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <!-- Menu Kembali ke Halaman Utama -->
    <div class="back-home">
      <a href="../index.html">← Kembali ke Halaman Utama</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tcikpmtuxaxjfucwjrah.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjaWtwbXR1eGF4amZ1Y3dqcmFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDc5MTUsImV4cCI6MjEwNjE4MzkxNX0.Tg75hNg6zzaRSJ-L5O3w9UtzQbyqBgjlMaLBGv_ANYc'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkExistingSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        window.location.href = '/petugas/inputbacaan.html';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('error-msg');

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      errBox.style.display = 'none';

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errBox.textContent = error.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk';
      } else {
        window.location.href = '/petugas/inputbacaan.html';
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
