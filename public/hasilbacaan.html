<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Hasil Bacaan</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: relative;
    }
    .header-bar img {
      height: 36px;
      width: auto;
    }
    .menu-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }
    .nav-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 20px;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      padding: 8px;
    }
    .nav-dropdown.show { display: block; }
    .user-profile-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }
    .user-profile-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .user-profile-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 2px;
      word-break: break-all;
    }
    .nav-item-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-item-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
    }
    .nav-item-btn.logout {
      color: var(--danger-color);
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
    .content-body { padding: 20px; }
    .officer-group {
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }
    .officer-group-header {
      background-color: #f8fafc;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .officer-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }
    .table-responsive { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #ffffff;
    }
    table th, table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
      vertical-align: middle;
    }
    table th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
      white-space: nowrap;
    }
    .img-preview {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .map-frame {
      width: 110px;
      height: 65px;
      border: none;
      border-radius: 6px;
    }
    .coord-badge {
      font-family: monospace;
      font-size: 11px;
      background: #f1f5f9;
      padding: 3px 6px;
      border-radius: 4px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-bar">
      <div id="nav-wrapper">
        <button class="menu-trigger-btn" onclick="toggleMenu()">
          <span>☰ Menu</span>
        </button>
        <div class="nav-dropdown" id="nav-dropdown">
          <div class="user-profile-item">
            <div class="label">Petugas Aktif</div>
            <div class="name" id="display-email">petugas@aetra.co.id</div>
          </div>
          <button class="nav-item-btn" onclick="window.location.href='inputbacaan.html'">
            📝 Input Bacaan
          </button>
          <button class="nav-item-btn active" onclick="window.location.href='hasilbacaan.html'">
            📋 Hasil Bacaan
          </button>
          <button class="nav-item-btn logout" onclick="logout()">
            🚪 Keluar / Logout
          </button>
        </div>
      </div>
      <img src="logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>

    <div class="content-body">
      <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Hasil Bacaan Meter</h2>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Data riwayat pencatatan meter yang telah diinput.</p>
      
      <div id="grouped-data-container">
        <p style="color: var(--text-muted); padding: 12px; font-size: 13px;">Memuat data...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dqyt19.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxeXQxOSIsInJvbGUiOiJhb24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function toggleMenu() {
      document.getElementById('nav-dropdown').classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
      const wrapper = document.getElementById('nav-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('nav-dropdown').classList.remove('show');
      }
    });

    async function checkAuthSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'loginpetugas.html';
      } else {
        document.getElementById('display-email').textContent = session.user.email;
        loadDataHasilBaca();
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'loginpetugas.html';
    }

    async function loadDataHasilBaca() {
      const container = document.getElementById('grouped-data-container');
      
      const { data, error } = await _supabase
        .from('meter_readings')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color:red; padding: 12px;">Error: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); padding: 12px; font-size: 13px;">Belum ada data hasil baca.</p>';
        return;
      }

      let html = `
        <div class="officer-group">
          <div class="officer-group-header">
            <span>📋 Rekap Data Masuk</span>
            <span class="officer-badge">${data.length} Data</span>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Waktu Baca</th>
                  <th>ID Pelanggan</th>
                  <th>Perusahaan</th>
                  <th>Cycle</th>
                  <th>Stand Meter</th>
                  <th>Latitude</th>
                  <th>Longitude</th>
                  <th>Foto Stand</th>
                  <th>Foto Berkas</th>
                  <th>Peta</th>
                </tr>
              </thead>
              <tbody>
      `;

      data.forEach(row => {
        const latVal = row.latitude ? row.latitude.toFixed(6) : '-';
        const lngVal = row.longitude ? row.longitude.toFixed(6) : '-';

        const fotoStandHtml = row.foto_meter_url 
          ? `<a href="${row.foto_meter_url}" target="_blank"><img src="${row.foto_meter_url}" class="img-preview" alt="Foto Stand"></a>` 
          : '-';

        const fotoBerkasHtml = row.foto_berkas_url 
          ? `<a href="${row.foto_berkas_url}" target="_blank"><img src="${row.foto_berkas_url}" class="img-preview" alt="Foto Berkas"></a>` 
          : '-';

        const mapHtml = (row.latitude && row.longitude)
          ? `<iframe class="map-frame" src="https://maps.google.com/maps?q=${row.latitude},${row.longitude}&z=15&output=embed" loading="lazy"></iframe>`
          : '-';

        html += `
          <tr>
            <td style="white-space: nowrap;">${new Date(row.created_at).toLocaleString('id-ID')}</td>
            <td><b>${row.id_pelanggan}</b></td>
            <td>${row.nama_perusahaan}</td>
            <td>${row.cycle}</td>
            <td><b>${row.stand_meter} m³</b></td>
            <td><span class="coord-badge">${latVal}</span></td>
            <td><span class="coord-badge">${lngVal}</span></td>
            <td>${fotoStandHtml}</td>
            <td>${fotoBerkasHtml}</td>
            <td>${mapHtml}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      </div>
      `;

      container.innerHTML = html;
    }

    checkAuthSession();
  </script>
</body>
</html>
