<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk SIMBA-IN - PT Aetra Air Tangerang</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <!-- CARD LOGIN -->
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-full sm:max-w-md space-y-6">
    
    <!-- LOGO AETRA -->
    <div class="flex justify-center">
      <div class="bg-slate-50 border border-slate-100 px-6 py-3 rounded-2xl flex items-center space-x-3 shadow-xs">
        <div class="w-10 h-10 bg-[#00529c] rounded-xl flex items-center justify-center">
          <i class="fa-solid fa-water text-orange-500 text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-[#00529c] tracking-tight leading-none">aetra</h1>
          <p class="text-[9px] text-orange-500 font-bold tracking-widest uppercase">AIR TANGERANG</p>
        </div>
      </div>
    </div>

    <!-- JUDUL HALAMAN -->
    <div class="text-center space-y-1">
      <h2 class="text-xl font-extrabold text-[#00529c]">Masuk SIMBA–IN</h2>
      <p class="text-xs text-slate-500 font-medium leading-relaxed">
        Sistem Informasi Monitoring Billing Air Industri<br>PT Aetra Air Tangerang
      </p>
    </div>

    <!-- FORM LOGIN -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      
      <!-- PILIH PENGGUNA -->
      <div class="space-y-1.5">
        <label class="block text-[11px] font-bold text-slate-500 tracking-wider uppercase">PILIH PENGGUNA / PERAN STAF</label>
        <div class="relative">
          <select id="userSelect" onchange="updateAuthorityInfo()" class="w-full appearance-none bg-slate-50/50 border border-slate-300 text-slate-800 text-xs rounded-xl px-4 py-3 pr-10 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition cursor-pointer">
            <option value="yaya">Pak Yaya (Tim Billing & Invoicing)</option>
            <option value="kabul">Pak Kabul (Admin Meter Reading)</option>
            <option value="solihin">Pak Solihin (Admin Meter Reading)</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-600">
            <i class="fa-solid fa-user-check text-sm"></i>
          </div>
        </div>
      </div>

      <!-- KOTAK INFORMASI OTORITAS -->
      <div id="authorityBox" class="bg-blue-50/60 border border-blue-200/80 rounded-xl p-3.5 flex items-start space-x-3 text-xs text-blue-900 transition-all">
        <i class="fa-regular fa-circle-check text-blue-600 text-base mt-0.5 flex-shrink-0"></i>
        <div class="space-y-0.5">
          <span id="authorityTitle" class="font-bold block text-blue-950">Otoritas Tim Billing:</span>
          <p id="authorityDesc" class="text-[11px] text-slate-600 leading-snug">
            Verifikasi billing akhir, penerbitan invoice resmi, cetak PDF, dan pengiriman invoice via Outlook/Email.
          </p>
        </div>
      </div>

      <!-- TOMBOL MASUK -->
      <button type="submit" class="w-full bg-[#00529c] hover:bg-[#00407a] text-white font-bold text-xs py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2 group">
        <span>Masuk ke Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
      </button>

    </form>
  </div>

  <script>
    // Data Otoritas Pengguna
    const authorities = {
      yaya: {
        title: "Otoritas Tim Billing:",
        desc: "Verifikasi billing akhir, penerbitan invoice resmi, cetak PDF, dan pengiriman invoice via Outlook/Email."
      },
      kabul: {
        title: "Otoritas Admin Meter Reading:",
        desc: "Pengelolaan jadwal cycle,plotting petugas pembacaan meter, dan verifikasi awal data meter lapangan."
      },
      solihin: {
        title: "Otoritas Admin Meter Reading:",
        desc: "Pengawasan hasil pembacaan meter industri, monitoring progress cycle, dan penanganan anomali stand."
      }
    };

    function updateAuthorityInfo() {
      const selected = document.getElementById('userSelect').value;
      const info = authorities[selected];
      if (info) {
        document.getElementById('authorityTitle').innerText = info.title;
        document.getElementById('authorityDesc').innerText = info.desc;
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const selectedUser = document.getElementById('userSelect').value;
      // Simpan session pengguna sederhana di localStorage
      localStorage.setItem('simba_user', selectedUser);
      // Redirect langsung ke Dashboard Admin utama
      window.location.href = 'admin.html';
    }
  </script>

</body>
</html>
