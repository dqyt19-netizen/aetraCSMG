<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Login Petugas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
    }
    .header-bar img {
      height: 42px;
      width: auto;
      object-fit: contain;
    }
    .content-body {
      padding: 24px;
    }
    .auth-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }
    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-bar">
      <img src="logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>
    <div class="content-body">
      <div class="auth-title">Login Petugas</div>
      <div class="auth-subtitle">Masukkan akun petugas untuk mencatat bacaan meter</div>
      
      <form id="form-login">
        <div class="form-group">
          <label>Email Petugas</label>
          <input type="email" id="login-email" class="form-control" placeholder="petugas@aetra.co.id" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">MASUK</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dntuitawhmpqkbepnmwk.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHVpdGF3aG1wcWtiZXBubXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0.9RHqwdWIb2xQ0M5I8xD189PB9Yms5gFbxNVqNa2BmlY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkAuthSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        window.location.href = 'inputbacaan.html';
      }
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login Gagal: ' + error.message);
      } else {
        window.location.href = 'inputbacaan.html';
      }
    });

    checkAuthSession();
  </script>
</body>
</html>
