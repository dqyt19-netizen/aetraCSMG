<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing - SIMBA-IN</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { aetra: { blue: '#0055A5', darkblue: '#003E78', orange: '#E86216' } } } } }
  </script>
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-aetra-darkblue text-slate-200 flex flex-col justify-between p-4 hidden md:flex shrink-0 h-full">
      <div>
        <div class="bg-white rounded-xl p-3 mb-6 flex items-center justify-center">
          <span class="font-extrabold text-aetra-blue text-sm">AETRA TANGERANG</span>
        </div>
        <nav class="space-y-1.5">
          <a href="./overview.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📊 Overview SIMBA-IN</a>
          <a href="./database.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📂 Database & Input Cycle</a>
          <a href="./verifikasi.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">✔️ Verifikasi Reading</a>
          <a href="./billing.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold bg-aetra-orange text-white shadow-md">🧾 Billing & Invoicing</a>
          <a href="./audit.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📋 Log Audit & Aktivitas</a>
        </nav>
      </div>
      <div class="pt-4 border-t border-blue-800/60">
        <a href="../index.html" class="text-xs text-rose-300 hover:underline flex items-center gap-2 font-bold">🚪 Keluar (Ke Halaman Utama)</a>
      </div>
    </aside>

    <!-- CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto">
      <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-20">
        <h1 class="font-extrabold text-aetra-blue text-base">🧾 Billing & Penagihan Invoice</h1>
        <button onclick="exportCSV()" class="px-3 py-1.5 bg-aetra-blue text-white rounded-xl text-xs font-bold">📥 Ekspor CSV</button>
      </header>

      <main class="p-6 space-y-6">
        <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="bg-slate-100 uppercase text-[10px]">
                <th class="p-3.5">Pelanggan</th>
                <th class="p-3.5">Volume</th>
                <th class="p-3.5">Estimasi Tagihan</th>
                <th class="p-3.5">Status Billing</th>
                <th class="p-3.5 text-center">Aksi Invoice</th>
              </tr>
            </thead>
            <tbody id="billingTable" class="divide-y font-medium"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script>
    let dataIndustri = JSON.parse(localStorage.getItem('aetra_industri_data')) || [];

    document.addEventListener("DOMContentLoaded", renderBilling);

    function renderBilling() {
      let tbody = document.getElementById('billingTable');
      tbody.innerHTML = '';
      let list = dataIndustri.filter(i => i.status === 'Verified' || i.status === 'Invoiced');

      list.forEach(i => {
        let vol = i.skrg - i.lalu;
        let total = vol * 12500;
        let badge = i.status === 'Invoiced' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3.5"><p class="font-bold">${i.nama}</p><p class="text-[10px] text-slate-400">${i.email || '-'}</p></td>
            <td class="p-3.5 font-mono text-aetra-orange font-bold">${vol} m³</td>
            <td class="p-3.5 font-mono font-bold">Rp ${total.toLocaleString()}</td>
            <td class="p-3.5"><span class="px-2 py-0.5 rounded-full text-[9px] font-bold ${badge}">${i.status}</span></td>
            <td class="p-3.5 text-center">
              <button onclick="kirimInvoice('${i.id}')" class="px-3 py-1.5 bg-aetra-orange text-white font-bold rounded-xl text-xs hover:bg-orange-600 transition">📧 Kirim Invoice Email</button>
            </td>
          </tr>
        `;
      });
    }

    function kirimInvoice(id) {
      let item = dataIndustri.find(i => i.id === id);
      if(item) {
        item.status = 'Invoiced';
        localStorage.setItem('aetra_industri_data', JSON.stringify(dataIndustri));
        window.location.href = `mailto:${item.email}?subject=Invoice%20Air%20Aetra&body=Tagihan%20sebesar%20Rp%20${(item.skrg-item.lalu)*12500}`;
        renderBilling();
      }
    }

    function exportCSV() {
      let csv = "ID,Nama,Volume,Status\n";
      dataIndustri.forEach(i => csv += `${i.id},"${i.nama}",${i.skrg-i.lalu},${i.status}\n`);
      let link = document.createElement("a");
      link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
      link.download = "rekap_billing.csv";
      link.click();
    }
  </script>
</body>
</html>
