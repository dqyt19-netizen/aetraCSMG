<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Login Dashboard Admin</title>
  <!-- Pustaka Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #1e293b; /* Warna tema khusus admin (Dark Slate) */
      --primary-hover: #0f172a;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px 16px 20px;
      background: #ffffff;
    }

    .header-bar img {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .content-body {
      padding: 0 24px 28px 24px;
    }

    .form-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      text-align: center;
    }

    .form-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .error-msg {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger-color);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--text-main);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-bar">
      <!-- Sesuaikan path logo jika file logoaetra.jpg berada di direktori utama (root) -->
      <img src="../logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>

    <div class="content-body">
      <h2 class="form-title">Login Dashboard Admin</h2>
      <p class="form-subtitle">Silakan masukkan akun admin Anda.</p>

      <div id="error-alert" class="error-msg"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Admin</label>
          <input type="email" id="email" required placeholder="admin@aetra.co.id">
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi (Password)</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Masuk Admin</button>
      </form>

      <a href="../index.html" class="back-link">← Kembali ke Halaman Utama</a>
    </div>
  </div>

  <script>
    // Konfigurasi Supabase (Pastikan kredensial ini sama dengan halaman lainnya)
    const SUPABASE_URL = 'https://tcikpmtuxaxjfucwjrah.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjaWtwbXR1eGF4amZ1Y3dqcmhqcmhAYXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDc5MTUsImV4cCI6MjEwNjE4MzkxNX0...'; // Gunakan key asli Anda yang valid
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const alertBox = document.getElementById('error-alert');

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      alertBox.style.display = 'none';

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Jika login berhasil, arahkan ke halaman database/dashboard admin
        window.location.href = 'database.html';
      } catch (err) {
        alertBox.textContent = err.message || 'Gagal masuk. Periksa kembali email dan kata sandi Anda.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk Admin';
      }
    }
  </script>
</body>
</html>
