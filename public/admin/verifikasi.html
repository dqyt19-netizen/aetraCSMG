<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifikasi - SIMBA-IN</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { aetra: { blue: '#0055A5', darkblue: '#003E78', orange: '#E86216' } } } } }
  </script>
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-aetra-darkblue text-slate-200 flex flex-col justify-between p-4 hidden md:flex shrink-0 h-full">
      <div>
        <div class="bg-white rounded-xl p-3 mb-6 flex items-center justify-center">
          <span class="font-extrabold text-aetra-blue text-sm">AETRA TANGERANG</span>
        </div>
        <nav class="space-y-1.5">
          <a href="./overview.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📊 Overview SIMBA-IN</a>
          <a href="./database.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📂 Database & Input Cycle</a>
          <a href="./verifikasi.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold bg-aetra-orange text-white shadow-md">✔️ Verifikasi Reading</a>
          <a href="./billing.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">🧾 Billing & Invoicing</a>
          <a href="./audit.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-aetra-blue transition">📋 Log Audit & Aktivitas</a>
        </nav>
      </div>
      <div class="pt-4 border-t border-blue-800/60">
        <a href="../index.html" class="text-xs text-rose-300 hover:underline flex items-center gap-2 font-bold">🚪 Keluar (Ke Halaman Utama)</a>
      </div>
    </aside>

    <!-- CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto">
      <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-20">
        <h1 class="font-extrabold text-aetra-blue text-base">✔️ Antrean Verifikasi Hasil Reading</h1>
      </header>

      <main class="p-6 space-y-6">
        <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="bg-slate-100 uppercase text-[10px]">
                <th class="p-3.5">Pelanggan</th>
                <th class="p-3.5">Stand Lalu</th>
                <th class="p-3.5">Stand Skrg</th>
                <th class="p-3.5">Status</th>
                <th class="p-3.5 text-center">Aksi Verifikasi</th>
              </tr>
            </thead>
            <tbody id="verifyTable" class="divide-y font-medium"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script>
    let dataIndustri = JSON.parse(localStorage.getItem('aetra_industri_data')) || [];

    document.addEventListener("DOMContentLoaded", renderVerifikasi);

    function renderVerifikasi() {
      let tbody = document.getElementById('verifyTable');
      tbody.innerHTML = '';
      let pending = dataIndustri.filter(i => i.status === 'Pending Verification');

      if(pending.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Semua data pembacaan sudah terverifikasi! 🎉</td></tr>`;
        return;
      }

      pending.forEach(i => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3.5"><p class="font-bold">${i.nama}</p><p class="text-[10px] text-slate-400">${i.id}</p></td>
            <td class="p-3.5 font-mono">${i.lalu}</td>
            <td class="p-3.5 font-mono font-bold text-aetra-blue">${i.skrg}</td>
            <td class="p-3.5"><span class="px-2 py-0.5 rounded-full text-[9px] bg-amber-100 text-amber-700 font-bold">${i.status}</span></td>
            <td class="p-3.5 text-center">
              <button onclick="approve('${i.id}')" class="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition">Setujui (Verified)</button>
            </td>
          </tr>
        `;
      });
    }

    function approve(id) {
      let item = dataIndustri.find(i => i.id === id);
      if(item) {
        item.status = 'Verified';
        localStorage.setItem('aetra_industri_data', JSON.stringify(dataIndustri));
        renderVerifikasi();
      }
    }
  </script>
</body>
</html>
