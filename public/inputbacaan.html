<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Form Input Bacaan</title>

  <!-- Library Supabase & Leaflet Maps -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* =========================================================
       1. CSS VARIABLES & RESET BASE
       ========================================================= */
    :root {
      --primary-color: #0284c7;
      --primary-hover: #0369a1;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* =========================================================
       2. TAMPILAN KARTU UTAMA & HEADER NAVIGATION
       ========================================================= */
    .app-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 700px;
      overflow: visible; /* Penting: Dibuat visible agar dropdown menu tidak terpotong */
      border: 1px solid var(--border-color);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      position: relative;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .header-bar img {
      height: 36px;
      width: auto;
    }
    .menu-trigger-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }
    .nav-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 20px;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 9999; /* Dipasang tinggi agar melayang di atas konten lain */
      padding: 8px;
    }
    .nav-dropdown.show { display: block; }
    .user-profile-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 6px;
    }
    .user-profile-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .user-profile-item .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 2px;
      word-break: break-all;
    }
    .nav-item-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-item-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
    }
    .nav-item-btn.logout {
      color: var(--danger-color);
      margin-top: 4px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    /* =========================================================
       3. FORMULIR INPUT & KOMPONEN LAINNYA
       ========================================================= */
    .content-body { padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group label span { color: var(--danger-color); }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-control[readonly] { background-color: #f1f5f9; color: #64748b; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .camera-upload-box {
      background-color: #f0f9ff;
      border: 1px dashed #0284c7;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .camera-upload-box label {
      font-size: 13px;
      font-weight: 600;
      color: #0369a1;
      display: block;
      margin-bottom: 6px;
    }
    #map-picker {
      height: 200px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-top: 6px;
    }
    .coords-info {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: block;
    }
    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- Header dan Menu Navigasi Dropdown -->
    <div class="header-bar">
      <div id="nav-wrapper">
        <button class="menu-trigger-btn" onclick="toggleMenu()">
          <span>☰ Menu</span>
        </button>
        <div class="nav-dropdown" id="nav-dropdown">
          <div class="user-profile-item">
            <div class="label">Petugas Aktif</div>
            <div class="name" id="display-email">petugas@aetra.co.id</div>
          </div>
          <button class="nav-item-btn active" onclick="window.location.href='inputbacaan.html'">
            📝 Input Bacaan
          </button>
          <button class="nav-item-btn" onclick="window.location.href='hasilbacaan.html'">
            📋 Hasil Bacaan
          </button>
          <button class="nav-item-btn logout" onclick="logout()">
            🚪 Keluar / Logout
          </button>
        </div>
      </div>
      <img src="logoaetra.jpg" alt="Logo Aetra Air Tangerang">
    </div>

    <!-- Isi Formulir Utama -->
    <div class="content-body">
      <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text-main);">Form Input Bacaan Meter</h2>
      
      <form id="form-input-bacaan">
        <div class="grid-2">
          <div class="form-group">
            <label>Tanggal Baca <span>*</span></label>
            <input type="date" id="reading_date" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Waktu Pembacaan <span>*</span></label>
            <input type="time" id="reading_time" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label>ID Pelanggan <span>*</span></label>
          <input type="text" id="customer_id" class="form-control" placeholder="Contoh: PLG-00123" required onchange="simulateFetchLastMonthMeter()">
        </div>

        <div class="form-group">
          <label>Nama Perusahaan <span>*</span></label>
          <input type="text" id="company_name" class="form-control" placeholder="Contoh: PT. Sumber Makmur" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Cycle <span>*</span></label>
            <select id="cycle" class="form-control" required>
              <option value="" disabled selected>-- Pilih Cycle --</option>
              <option value="1">Cycle 1</option>
              <option value="2">Cycle 2</option>
              <option value="3">Cycle 3</option>
              <option value="4">Cycle 4</option>
              <option value="5">Cycle 5</option>
              <option value="6">Cycle 6</option>
              <option value="7">Cycle 7</option>
              <option value="8">Cycle 8</option>
              <option value="9">Cycle 9</option>
              <option value="10">Cycle 10</option>
              <option value="11">Cycle 11</option>
              <option value="12">Cycle 12</option>
              <option value="13">Cycle 13</option>
              <option value="14">Cycle 14</option>
              <option value="15">Cycle 15</option>
            </select>
          </div>

          <div class="form-group">
            <label>Stand Meter Air Terakhir (m³)</label>
            <input type="number" id="stand_bulan_lalu" class="form-control" value="1250.00" readonly>
          </div>
        </div>

        <div class="form-group">
          <label>Stand Meter Air Sekarang (m³) <span>*</span></label>
          <input type="number" step="0.01" id="stand_meter" class="form-control" placeholder="0000.00" required>
        </div>

        <div class="camera-upload-box">
          <label>📷 1. Foto Stand Meter Air <span>*</span></label>
          <input type="file" id="foto_stand_meter" accept="image/*" capture="environment" required />
        </div>

        <div class="camera-upload-box">
          <label>📷 2. Foto Bukti Pencatatan Meter <span>*</span></label>
          <input type="file" id="foto_berkas" accept="image/*" capture="environment" required />
        </div>

        <div class="form-group">
          <label>Penyesuaian Lokasi GPS (Geser Pin Peta) <span>*</span></label>
          <div id="map-picker"></div>
          <span class="coords-info">Koordinat: <strong id="coords-text">Mendeteksi lokasi...</strong></span>
        </div>

        <button type="submit" id="btn-submit-reading" class="btn-primary" style="margin-top: 8px;">
          SUBMIT
        </button>
      </form>
    </div>
  </div>

  <script>
    /* =========================================================
       1. INISIALISASI SUPABASE & VARIABEL GLOBAL
       ========================================================= */
    const SUPABASE_URL = 'https://dntuitawhmpqkbepnmwk.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHVpdGF3aG1wcWtiZXBubXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTQ3ODksImV4cCI6MjEwNTc5MDc4OX0.9RHqwdWIb2xQ0M5I8xD189PB9Yms5gFbxNVqNa2BmlY'; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let loggedInUser = null;
    let map, marker;
    let selectedLat = -6.175392; // Default koordinat
    let selectedLng = 106.827153;

    /* =========================================================
       2. KONTROL MENU DROPDOWN & UTILITY
       ========================================================= */
    function toggleMenu() {
      document.getElementById('nav-dropdown').classList.toggle('show');
    }

    // Menutup menu jika mengklik di luar area menu
    window.addEventListener('click', function(e) {
      const wrapper = document.getElementById('nav-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('nav-dropdown').classList.remove('show');
      }
    });

    function setTodayDateTime() {
      const now = new Date();
      document.getElementById('reading_date').value = now.toISOString().split('T')[0];
      document.getElementById('reading_time').value = now.toTimeString().split(' ')[0].substring(0, 5);
    }

    function simulateFetchLastMonthMeter() {
      const id = document.getElementById('customer_id').value;
      if(id) {
        const dummyValue = (1000 + Math.floor(Math.random() * 500)).toFixed(2);
        document.getElementById('stand_bulan_lalu').value = dummyValue;
      }
    }

    /* =========================================================
       3. PENGECEKAN STATUS LOKASI / GPS DI HP PETUGAS
       ========================================================= */
    function checkGPSPermission() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            // Jika lokasi berhasil didapat, perbarui posisi pin pada peta
            selectedLat = position.coords.latitude;
            selectedLng = position.coords.longitude;
            const userLatLng = [selectedLat, selectedLng];

            if (map && marker) {
              map.setView(userLatLng, 16);
              marker.setLatLng(userLatLng);
              document.getElementById('coords-text').textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
              setTimeout(() => map.invalidateSize(), 300);
            }
          },
          (error) => {
            // Memberikan notifikasi spesifik jika GPS mati atau ditolak
            if (error.code === error.PERMISSION_DENIED) {
              alert("⚠️ PERHATIAN:\n\nAkses lokasi ditolak. Harap izinkan akses lokasi pada browser Anda agar koordinat pencatatan meter akurat.");
            } else if (error.code === error.POSITION_UNAVAILABLE || error.code === error.TIMEOUT) {
              alert("📍 GPS TIDAK AKTIF:\n\nHarap hidupkan/aktifkan fitur Lokasi (GPS) di HP Anda untuk melanjutkan pencatatan meter.");
            }
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        alert("Browser di perangkat Anda tidak mendukung pencatatan lokasi GPS.");
      }
    }

    /* =========================================================
       4. INITIALISASI PETA INTERAKTIF (LEAFLET)
       ========================================================= */
    function initMapPicker() {
      if (!map) {
        map = L.map('map-picker').setView([selectedLat, selectedLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map);

        // Jika pin digeser manual oleh petugas
        marker.on('dragend', function () {
          const latlng = marker.getLatLng();
          selectedLat = latlng.lat;
          selectedLng = latlng.lng;
          document.getElementById('coords-text').textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
        });
      }
    }

    /* =========================================================
       5. AUTENTIKASI SESSION CHECK
       ========================================================= */
    async function checkAuthSession() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'loginpetugas.html';
      } else {
        loggedInUser = session.user;
        document.getElementById('display-email').textContent = session.user.email;
        setTodayDateTime();
        initMapPicker();
        
        // Minta/Cek lokasi GPS HP otomatis setelah login dikonfirmasi
        checkGPSPermission();
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'loginpetugas.html';
    }

    /* =========================================================
       6. OLAH FOTO: WATERMARK STAMP & UPLOAD SUPABASE STORAGE
       ========================================================= */
    function addTimestampWatermark(file, timestampText) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            // Pengaturan ukuran font dan banner watermark
            const fontSize = Math.max(16, Math.floor(img.width / 28));
            ctx.font = `bold ${fontSize}px sans-serif`;

            const padding = fontSize * 0.8;
            const bannerHeight = fontSize * 2.5 + padding;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, img.height - bannerHeight, img.width, bannerHeight);

            // Menulis teks tanggal dan koordinat GPS di atas foto
            ctx.fillStyle = '#ffffff';
            ctx.fillText(timestampText.line1, padding, img.height - bannerHeight + fontSize + 4);
            ctx.fillStyle = '#fde047';
            ctx.fillText(timestampText.line2, padding, img.height - bannerHeight + (fontSize * 2) + 8);

            canvas.toBlob((blob) => {
              const watermarkedFile = new File([blob], file.name, { type: file.type });
              resolve(watermarkedFile);
            }, file.type, 0.92);
          };
        };
      });
    }

    async function processAndUploadPhoto(fileInputId, pathPrefix, timeStr, lat, lng) {
      const fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) return null;

      const originalFile = fileInput.files[0];
      const timestampText = {
        line1: `🕒 Waktu Baca: ${timeStr}`,
        line2: `📍 GPS: Lat ${lat.toFixed(6)}, Lng ${lng.toFixed(6)}`
      };

      const watermarkedFile = await addTimestampWatermark(originalFile, timestampText);
      const fileExt = originalFile.name.split('.').pop();
      const fileName = `${pathPrefix}/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

      const { error } = await _supabase.storage
        .from('meter-proofs')
        .upload(fileName, watermarkedFile, { cacheControl: '3600', upsert: false });

      if (error) return null;

      const { data: publicUrlData } = _supabase.storage
        .from('meter-proofs')
        .getPublicUrl(fileName);

      return publicUrlData.publicUrl;
    }

    /* =========================================================
       7. HANDLER SUBMIT FORM PENCATATAN
       ========================================================= */
    document.getElementById('form-input-bacaan').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-reading');
      btn.disabled = true;
      btn.textContent = 'PROSES SUBMIT...';

      try {
        const readingDate = document.getElementById('reading_date').value;
        const readingTime = document.getElementById('reading_time').value;
        const formattedTimeStr = `${readingDate} ${readingTime}`;

        // Upload foto + stamp watermark
        const urlFotoMeter = await processAndUploadPhoto('foto_stand_meter', 'stand_meter', formattedTimeStr, selectedLat, selectedLng);
        const urlFotoBerkas = await processAndUploadPhoto('foto_berkas', 'berkas', formattedTimeStr, selectedLat, selectedLng);

        const payload = {
          petugas_id: loggedInUser.id,
          id_pelanggan: document.getElementById('customer_id').value,
          nama_perusahaan: document.getElementById('company_name').value,
          cycle: parseInt(document.getElementById('cycle').value),
          stand_meter: parseFloat(document.getElementById('stand_meter').value) || 0,
          latitude: selectedLat,
          longitude: selectedLng,
          foto_meter_url: urlFotoMeter,
          foto_berkas: urlFotoBerkas,
          created_at: new Date(`${readingDate}T${readingTime}`).toISOString()
        };

        const { error } = await _supabase.from('meter_readings').insert([payload]);
        if (error) throw error;

        alert('✅ Data hasil bacaan meter berhasil disimpan!');
        document.getElementById('form-input-bacaan').reset();
        setTodayDateTime();

      } catch (err) {
        alert('❌ Gagal menyimpan data: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'SUBMIT';
      }
    });

    // Jalankan pemeriksaan autentikasi dan inisialisasi awal
    checkAuthSession();
  </script>
</body>
</html>
