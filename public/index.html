<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetra Air Tangerang - Sistem Informasi Pencatatan Meter</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-center items-center p-4">

  <!-- CONTAINER UTAMA -->
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    
    <!-- HEADER LOGO AETRA AIR TANGERANG -->
    <div class="bg-white p-6 border-b flex justify-center items-center">
      <img 
        src="https://upload.wikimedia.org/wikipedia/commons/2/23/Logo_Aetra_Air_Tangerang.jpg" 
        alt="Logo Aetra Air Tangerang" 
        class="h-16 object-contain"
      >
    </div>

    <!-- TAB PILIHAN: PETUGAS / ADMIN -->
    <div class="flex border-b text-sm font-bold text-center bg-gray-50">
      <button 
        type="button" 
        id="tabPetugas" 
        class="w-1/2 py-3 border-b-2 border-blue-600 text-blue-600 font-bold focus:outline-none transition-colors cursor-pointer"
      >
        Petugas Meter
      </button>
      <button 
        type="button" 
        id="tabAdmin" 
        class="w-1/2 py-3 border-b-2 border-transparent text-gray-500 font-bold hover:text-gray-700 focus:outline-none transition-colors cursor-pointer"
      >
        Administrator
      </button>
    </div>

    <!-- FORM 1: LOGIN PETUGAS METER -->
    <div id="sectionPetugas" class="p-6">
      <h2 class="text-lg font-bold text-gray-800 text-center mb-4">Login Petugas Meter</h2>
      
      <form id="formPetugas" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Nama Petugas</label>
          <select id="selectPetugas" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
            <option value="">-- Pilih Nama Anda --</option>
            <option value="udin@aetra.co.id">Udin</option>
            <option value="raka@aetra.co.id">Raka</option>
            <option value="dimas@aetra.co.id">Dimas</option>
            <option value="adel@aetra.co.id">Adel</option>
            <option value="damra@aetra.co.id">Damra</option>
            <option value="yayat@aetra.co.id">Yayat</option>
            <option value="rika@aetra.co.id">Rika</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input 
            type="password" 
            id="passPetugas" 
            value="123456" 
            placeholder="••••••••" 
            required 
            class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          >
        </div>

        <button 
          type="submit" 
          id="btnPetugas" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200"
        >
          MASUK PETUGAS
        </button>
      </form>
    </div>

    <!-- FORM 2: LOGIN ADMIN -->
    <div id="sectionAdmin" class="p-6 hidden">
      <h2 class="text-lg font-bold text-gray-800 text-center mb-4">Login Administrator</h2>
      
      <form id="formAdmin" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Email Admin</label>
          <input 
            type="email" 
            id="emailAdmin" 
            placeholder="admin@aetra.co.id" 
            required 
            class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          >
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input 
            type="password" 
            id="passAdmin" 
            placeholder="••••••••" 
            required 
            class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          >
        </div>

        <button 
          type="submit" 
          id="btnAdmin" 
          class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg shadow transition duration-200"
        >
          MASUK ADMIN
        </button>
      </form>
    </div>

  </div>

  <script>
    // =========================================================
    // ISIKAN KUNCI SUPABASE ANDA
    // =========================================================
    const SUPABASE_URL = "https://lfqhhyaxctbfaxjjytdz.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWhoeWF4Y3RiZmF4amp5dGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjE4MTYsImV4cCI6MjEwNTczNzgxNn0.uungyF3lq6-XH8lxW6SLeJDkTh7_eW0F1ss0Qzc3f0A";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Dapatkan elemen DOM
    const tabPetugas = document.getElementById('tabPetugas');
    const tabAdmin = document.getElementById('tabAdmin');
    const sectionPetugas = document.getElementById('sectionPetugas');
    const sectionAdmin = document.getElementById('sectionAdmin');

    // Event Listener Klik Tab Petugas
    tabPetugas.addEventListener('click', () => {
      sectionPetugas.classList.remove('hidden');
      sectionAdmin.classList.add('hidden');
      
      tabPetugas.className = "w-1/2 py-3 border-b-2 border-blue-600 text-blue-600 font-bold focus:outline-none transition-colors cursor-pointer";
      tabAdmin.className = "w-1/2 py-3 border-b-2 border-transparent text-gray-500 font-bold hover:text-gray-700 focus:outline-none transition-colors cursor-pointer";
    });

    // Event Listener Klik Tab Admin
    tabAdmin.addEventListener('click', () => {
      sectionPetugas.classList.add('hidden');
      sectionAdmin.classList.remove('hidden');
      
      tabAdmin.className = "w-1/2 py-3 border-b-2 border-gray-800 text-gray-800 font-bold focus:outline-none transition-colors cursor-pointer";
      tabPetugas.className = "w-1/2 py-3 border-b-2 border-transparent text-gray-500 font-bold hover:text-gray-700 focus:outline-none transition-colors cursor-pointer";
    });

    // Process Login Petugas
    document.getElementById('formPetugas').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnPetugas');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const email = document.getElementById('selectPetugas').value;
      const password = document.getElementById('passPetugas').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          alert("Login Petugas Gagal: " + error.message);
          btn.innerText = "MASUK PETUGAS";
          btn.disabled = false;
        } else {
          window.location.href = "petugas.html";
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi. Pastikan SUPABASE_URL & SUPABASE_KEY sudah benar.");
        btn.innerText = "MASUK PETUGAS";
        btn.disabled = false;
      }
    });

    // Process Login Admin
    document.getElementById('formAdmin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnAdmin');
      btn.innerText = "Memproses...";
      btn.disabled = true;

      const email = document.getElementById('emailAdmin').value;
      const password = document.getElementById('passAdmin').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          alert("Login Admin Gagal: " + error.message);
          btn.innerText = "MASUK ADMIN";
          btn.disabled = false;
        } else {
          window.location.href = "admin.html";
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi. Pastikan SUPABASE_URL & SUPABASE_KEY sudah benar.");
        btn.innerText = "MASUK ADMIN";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
